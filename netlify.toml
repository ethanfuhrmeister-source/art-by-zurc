# The catalogue is plain static files — no build step, nothing to compile.
# Netlify serves the repository root as-is.

[build]
  publish = "."

# catalogue.json is the live inventory; never let it be served stale.
[[headers]]
  for = "/catalogue.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Photos are content-addressed by filename and never rewritten in place.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
