# The catalogue is plain static files — no build step, nothing to compile.
# Netlify serves the repository root as-is.

[build]
  publish = "."
  # The website reads the catalogue from the publishing service now, so a
  # commit that only touches catalogue.json has nothing to rebuild. Exit 0
  # means "skip this build": that is what git diff returns when nothing
  # outside catalogue.json changed. Belt and braces alongside the
  # [skip netlify] marker the service puts on its backup commits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)catalogue.json'"

# catalogue.json is the live inventory; never let it be served stale.
[[headers]]
  for = "/catalogue.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Photos never change once uploaded, so they cache well — but this rule applies
# to the path, not the result. A photo requested mid-deploy answers 404, and with
# a year of immutable caching a browser would hold that failure for a year and
# never ask again. An hour, revalidated, keeps them fast and lets a miss heal.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
