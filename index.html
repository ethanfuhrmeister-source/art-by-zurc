  function movePhoto(p, i, d) {
    var j = i + d;
    if (j < 0 || j >= p.photos.length) return;
    var t = p.photos[i]; p.photos[i] = p.photos[j]; p.photos[j] = t;
    touch(); renderStudio();
  }

  /* ---------------- descriptions ---------------- */
  /* One pass over everything without a description. Each one is saved as it
     arrives, so stopping halfway keeps what was already done. */
  function describeAll() {
    describeThese(state.pieces.filter(function (p) {
      return !String(p.description || "").trim() && cover(p);
    }));
  }

  function describeThese(todo) {
    todo = (todo || []).filter(function (p) { return cover(p); });
    if (!todo.length || !useApi() || !canPublish()) return;
    var note = document.getElementById("s-descnote");
    var btn = document.getElementById("s-describe");
    if (btn) btn.disabled = true;
    var done = 0, failed = 0;

    (function next(i) {
      if (i >= todo.length) {
        message = {
          text: failed
            ? done + " described, " + failed + " could not be read."
            : done + " described.",
          bad: failed > 0
        };
        renderStudio();
        return;
      }
      var p = todo[i];
      if (note) note.textContent = "Describing " + (i + 1) + " of " + todo.length + " — " + p.sku + "…";
      photoBase64(p, 600).then(function (b64) {
        return fetch(apiBase() + "/describe", {
          method: "POST",
          headers: { Authorization: "Bearer " + session(), "Content-Type": "application/json" },
          body: JSON.stringify({
            image: b64,
            piece: { sku: p.sku, title: p.title || "", size: p.size || "", notes: p.notes || "" }
          })
        });
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error(j.error || ("Failed (" + r.status + ")"));
          return j;
        });
      }).then(function (j) {
        p.description = j.description || "";
        p.keywords = Array.isArray(j.keywords) ? j.keywords : [];
        touch(); done++;
        next(i + 1);
      }).catch(function () { failed++; next(i + 1); });
    })(0);
  }

  /* ---------------- price suggestions ---------------- */
  /* A small JPEG of the cover photo — enough for the model to judge form and
     finish, small enough to post quickly. */
  function photoBase64(p, maxEdge) {
    return new Promise(function (resolve, reject) {
      var ph = cover(p);
      if (!ph) { reject(new Error("This piece has no photo yet.")); return; }
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL("image/jpeg", 0.75).split(",")[1]); }
        catch (e) { reject(new Error("Could not read that photo.")); }
      };
      img.onerror = function () { reject(new Error("Could not load that photo.")); };
      img.src = photoSrc(ph);
    });
  }

  function comparables(exceptId) {
    return state.pieces
      .filter(function (x) { return x.id !== exceptId && String(x.price || "").trim(); })
      .slice(0, 12)
      .map(function (x) {
        return { sku: x.sku, title: x.title || "", size: x.size || "", price: x.price };
      });
  }

  function suggestPrice(p, el) {
    var btn = el.querySelector("#e-suggest"),
        hint = el.querySelector("#e-pricehint"),
        input = el.querySelector("#e-price");
    if (!btn || btn.disabled) return;
    if (location.protocol !== "https:" && !localPreview()) {
      hint.className = "hint";
      hint.textContent = "Open this page at https:// and sign in again.";
      return;
    }
    btn.disabled = true;
    hint.className = "hint thinking";
    hint.textContent = "Looking at the photo…";

    photoBase64(p, 600).then(function (b64) {
      return fetch(apiBase() + "/suggest-price", {
        method: "POST",
        headers: { Authorization: "Bearer " + session(), "Content-Type": "application/json" },
        body: JSON.stringify({
          image: b64,
          piece: { sku: p.sku, title: p.title || "", size: p.size || "", notes: p.notes || "" },
          comparables: comparables(p.id)
        })
      });
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ("Suggestion failed (" + r.status + ")"));
        return j;
      });
    }).then(function (j) {
      var price = "$" + Math.round(j.price);
      p.price = price;
      p.suggested = true;
      var bits = [];
      if (j.basis === "comparables" && j.anchor) bits.push("Suggested from " + j.anchor);
      else bits.push("Suggested estimate");
      if (j.low && j.high) bits.push("$" + Math.round(j.low) + "–$" + Math.round(j.high));
      if (j.note) bits.push(j.note);
      p.suggestedNote = bits.join(" · ");
      touch();
      if (input) { input.value = price; input.classList.add("suggested"); }
      hint.className = "hint";
      hint.textContent = p.suggestedNote;
      refreshSaveBar();
      btn.disabled = false;
    }).catch(function (err) {
      var m = String((err && err.message) || err);
      hint.className = "hint";
      /* a failed fetch is a connection problem, not something she did */
      hint.textContent = /failed to fetch|networkerror|load failed/i.test(m)
        ? "Could not reach the pricing service."
        : m;
      btn.disabled = false;
    });
  }

  function suggestedCount() {
    return state.pieces.filter(function (p) { return p.suggested; }).length;
  }

  /* ---------------- photo intake ---------------- */
  function shrink(file, maxEdge, quality) {
    return new Promise(function (resolve, reject) {
      var work = window.createImageBitmap
        ? createImageBitmap(file, { imageOrientation: "from-image" })
            .catch(function () { return createImageBitmap(file); })
        : Promise.reject(new Error("unsupported"));
      work.then(function (bmp) {
        var scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
        var w = Math.max(1, Math.round(bmp.width * scale));
        var h = Math.max(1, Math.round(bmp.height * scale));
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(bmp, 0, 0, w, h);
        if (bmp.close) bmp.close();
        resolve({ url: c.toDataURL("image/jpeg", quality), w: w, h: h });
      }).catch(reject);
    });
  }

  function intake(files, pieceId) {
    var created = [];
    if (!files || !files.length) return;
    var list = Array.prototype.slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
    if (!list.length) {
      message = { text: "Those were not photos. Try JPEG, PNG or HEIC images.", bad: true };
      renderStudio(); return;
    }
    message = { text: "Preparing " + list.length + " photo" + (list.length > 1 ? "s" : "") + "…" };
    renderStudio();

    var done = 0, failed = 0;
    (function next(i) {
      if (i >= list.length) {
        message = failed
          ? { text: done + " added, " + failed + " could not be read.", bad: true }
          : { text: done + " photo" + (done > 1 ? "s" : "") + " added.", bad: false };
        renderStudio();
        /* Describe what just came in, so it is searchable straight away. */
        if (created.length) describeThese(created);
        return;
      }
      shrink(list[i], 1600, 0.8).then(function (img) {
        return img.url.length > 1200000 ? shrink(list[i], 1300, 0.7) : img;
      }).then(function (img) {
        var photo = { id: uid(), url: img.url, w: img.w, h: img.h, pending: true };
        if (pieceId) {
          for (var k = 0; k < state.pieces.length; k++) {
            if (state.pieces[k].id === pieceId) state.pieces[k].photos.push(photo);
          }
        } else {
          var made = {
            id: uid(), sku: makeSku(), title: "", price: "", size: "", notes: "",
            sold: false, photos: [photo]
          };
          state.pieces.push(made);
          created.push(made);
        }
        done++; touch(); next(i + 1);
      }).catch(function () { failed++; next(i + 1); });
    })(0);
  }

  /* ---------------- publishing to GitHub ---------------- */
  function ghHeaders() {
    if (useApi()) {
      return { Authorization: "Bearer " + session(), "Content-Type": "application/json" };
    }
    return {
      Authorization: "Bearer " + token(),
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }
  function repoUrl(conf) {
    return (useApi() ? apiBase() + "/gh" : API) + "/repos/" + conf.owner + "/" + conf.repo;
  }
  function contentsUrl(conf, path) {
    return repoUrl(conf) + "/contents/" + path;
  }
  function getSha(conf, path) {
    return fetch(contentsUrl(conf, path) + "?ref=" + conf.branch + "&t=" + Date.now(),
      { headers: ghHeaders(), cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { return j && j.sha ? j.sha : null; })
      .catch(function () { return null; });
  }
  function putFile(conf, path, base64, msg, sha) {
    var body = { message: msg, content: base64, branch: conf.branch };
    if (sha) body.sha = sha;
    return fetch(contentsUrl(conf, path), {
      method: "PUT", headers: ghHeaders(), body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
        throw new Error((j && j.message) || ("GitHub " + r.status));
      });
      return r.json();
    });
  }
  function deleteFile(conf, path) {
    return getSha(conf, path).then(function (sha) {
      if (!sha) return null;
      return fetch(contentsUrl(conf, path), {
        method: "DELETE", headers: ghHeaders(),
        body: JSON.stringify({ message: "Remove " + path, sha: sha, branch: conf.branch })
      });
    }).catch(function () { return null; });
  }
  function b64(dataUrl) { return dataUrl.slice(dataUrl.indexOf(",") + 1); }
  function utf8b64(str) {
    return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(str)));
  }

  function publish(quiet) {
    if (busy) return;
    clearTimeout(autoTimer);
    autoStatus = ""; publishFailed = false;
    if (!canPublish()) {
      message = {
        text: useApi() ? "Sign in at the top before publishing."
                       : "This device has no key yet — set one up at the top.",
        bad: true
      };
      studioView = "list"; renderStudio(); return;
    }
    var blank = state.pieces.filter(function (p) { return !String(p.sku || "").trim(); });
    blank.forEach(function (p) { p.sku = makeSku(); });
    var seen = {}, dupe = null;
    state.pieces.forEach(function (p) {
      var k = String(p.sku).trim().toLowerCase();
      if (seen[k]) dupe = p.sku; else seen[k] = 1;
    });
    if (dupe) {
      message = { text: "Two pieces share the item number " + dupe + ". Give one of them a different number.", bad: true };
      studioView = "list"; renderStudio(); return;
    }

    busy = true;
    var conf = repoConf();
    var jobs = [];
    state.pieces.forEach(function (p) {
      p.photos.forEach(function (ph) { if (ph.pending && ph.url) jobs.push({ piece: p, photo: ph }); });
    });
    var step = 0;

    function progress(t) { message = { text: t }; renderStudio(); }
    progress(jobs.length ? "Uploading photos…" : "Publishing…");

    (function upload(i) {
      if (i >= jobs.length) return finish();
      var job = jobs[i], ph = job.photo;
      var path = "photos/" + new Date().toISOString().slice(0, 10) + "-" +
                 slug(job.piece.sku) + "-" + (ph.id || uid()) + ".jpg";
      progress("Uploading photo " + (++step) + " of " + jobs.length + "…");
      putFile(conf, path, b64(ph.url), "Add " + path)
        .then(function () {
          ph.file = path;
          delete ph.url;
          delete ph.pending;
          upload(i + 1);
        })
        .catch(function (err) { fail(err); });
    })(0);

    function finish() {
      progress("Saving the catalogue…");
      var data = {
        version: 2,
        name: state.name,
        trade: state.trade,
        contact: state.contact,
        showPrices: state.showPrices,
        skuPrefix: state.skuPrefix,
        siteUrl: state.siteUrl,
        apiUrl: state.apiUrl,
        nextSku: state.nextSku,
        pieces: state.pieces.map(function (p) {
          return {
            id: p.id, sku: p.sku, title: p.title || "", price: p.price || "",
            size: p.size || "", notes: p.notes || "", sold: !!p.sold,
            description: p.description || "", keywords: p.keywords || [],
            photos: p.photos.filter(function (ph) { return ph.file; })
              .map(function (ph) { return { file: ph.file, w: ph.w, h: ph.h }; })
          };
        })
      };
      /* Write against the version this device last saw. If the catalogue moved
         on somewhere else, GitHub refuses rather than quietly overwriting it. */
      Promise.resolve(catalogueSha || getSha(conf, "catalogue.json"))
        .then(function (sha) {
          return putFile(conf, "catalogue.json", utf8b64(JSON.stringify(data, null, 2)),
            "Update catalogue", sha);
        })
        .then(function (res) {
          catalogueSha = (res && res.content && res.content.sha) || null;
          return res;
        })
        .then(function () {
          var dead = pendingDeletes.slice();
          pendingDeletes = [];
          return Promise.all(dead.map(function (f) { return deleteFile(conf, f); }));
        })
        .then(function () {
          busy = false;
          dirty = false;
          publishFailed = false;
          autoStatus = "On the website.";
          if (!quiet) message = { text: "Published. The website updates in about a minute." };
          renderStudio();
          if (autoQueued) { autoQueued = false; scheduleAuto(); }
        })
        .catch(function (err) { fail(err); });
    }

    function fail(err) {
      busy = false;
      publishFailed = true;
      var m = String((err && err.message) || err || "");
      var text;
      if (/401|sign in/i.test(m) && useApi()) {
        signOut();
        studioView = "list"; /* the sign-in field lives on the list */
        text = "That session has run out. Sign in again and publish once more.";
      } else if (/bad credentials|401/i.test(m) && useApi()) {
        /* The service's own GitHub key, not anything she can fix. */
        text = "The website would not accept the change. The studio's GitHub key needs renewing — " +
               "tell whoever set this up. Nothing you did is lost.";
      } else if (/401|Bad credentials/i.test(m)) {
        studioView = "list";
        text = "The key was refused. It may have expired — make a new token and save it again.";
      } else if (/403|404/.test(m)) {
        text = "No permission to write to this repository. Check the token covers " +
               conf.owner + "/" + conf.repo + " with Contents set to read and write.";
      } else if (/409|conflict|does not match|sha/i.test(m)) {
        /* Another device published since this one loaded. Take theirs and start
           again rather than overwrite work that is not on this screen. */
        catalogueSha = null;
        text = "This was changed on another device. Reloading so you do not lose their work — " +
               "make your change again.";
        setTimeout(function () { location.reload(); }, 2500);
      } else {
        text = "Publishing stopped: " + m + ". Your work is still here — try again.";
      }
      message = { text: text, bad: true };
      renderStudio();
    }
  }

  /* ---------------- go ---------------- */
  window.addEventListener("beforeunload", function (e) {
    if (!dirty && !pendingCount()) return;
    e.preventDefault();
    e.returnValue = "";
    return "";
  });

  load();
  window.addEventListener("hashchange", function () {
    if (!studioOpen && !printOpen) openFromHash();
  });
})();
</script>
</body>
</html>
